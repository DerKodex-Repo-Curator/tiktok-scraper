[project]
name = "tiktok-dl"
version = "0.1.0"
description = "TikTok downloader core package using yt-dlp"
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2024.0.0",
    "curl-cffi>=0.8",
    "PySocks>=1.7",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
tiktok-dl = "tiktok_dl.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tiktok_dl*", "api*"]